<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<script>
  // A 404 page can be served from any missing address, so make every link
  // and file below start from the site root (works on GitHub Pages project sites).
  var seg = location.pathname.split("/")[1];
  var BASE = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  document.write('<base href="' + BASE + '">');
</script>
<link rel="stylesheet" href="style.css">
<style>
main{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:40px 6vw}
.code{font:700 clamp(6rem,24vw,12rem)/1 var(--head);color:var(--accent);letter-spacing:-.04em}
h1{font:600 clamp(1.6rem,4.5vw,2.4rem)/1.2 var(--head)}
p{color:var(--mute);max-width:42ch}
.cta{justify-content:center;margin-top:12px}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Page not found</h1>
  <p>The page you’re looking for doesn’t exist, or it has moved.</p>
  <div class="cta">
    <a class="btn" href="./">Back to home</a>
    <a class="btn ghost" href="ownership.html">Ownership</a>
    <a class="btn ghost" href="groups.html">Groups</a>
  </div>
</main>
<script src="site.js"></script>
<script>document.title = "Page not found | " + CONFIG.company;</script>
</body>
</html>
